<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forex Robot Control 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-gray-950 to-slate-900 text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass border-b border-white/10 px-5 py-4">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div>
        <h1 class="text-xl font-extrabold tracking-wide text-blue-400">FOREX CONTROL</h1>
        <p class="text-xs text-gray-400">Robot MASNURRUDDIN --- Sabtu Subuh Jam 4 Market Tutup</p>
      </div>
      <div class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full space-y-5">

    <!-- Robot Selector -->
    <section class="glass rounded-3xl p-5 border border-white/10 shadow-2xl">
      <label class="block text-sm text-gray-400 mb-3 font-medium">Pilih Robot Trading</label>
      <div class="relative">
        <select id="robotSelect" class="w-full appearance-none bg-slate-950 border border-blue-500/40 rounded-2xl px-5 py-4 text-lg font-bold text-white shadow-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" style="line-height: 4.8rem; padding-top: 18px; padding-bottom: 18px;">
          <option value="Robot1" style="padding:18px;">🤖 Robot1 - 263415380</option>
          <option value="Robot2" style="padding:18px;">🤖 Robot2 - xxxxxxxxx</option>
         </select>
        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-blue-400 text-xl">
          ▼
        </div>
      </div>
    </section>

    <!-- Status Card -->
    <section class="glass rounded-3xl p-6 border border-white/10 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 id="selectedRobot" class="text-2xl font-extrabold">Robot1</h2>
          <p class="text-gray-400 text-sm">Live account control</p>
        </div>
        <div id="statusBadge" class="px-4 py-2 rounded-full bg-green-500/20 text-green-400 font-bold text-sm">
          RUNNING
        </div>
      </div>

      <button id="actionButton" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition-all rounded-2xl py-4 text-xl font-extrabold shadow-lg">
        STOP ROBOT
      </button>
    </section>

    <!-- Quick Stats -->
    <section class="grid grid-cols-2 gap-4">
      <div class="glass rounded-2xl p-4 border border-white/10">
        <p class="text-gray-400 text-xs">Response</p>
        <p class="font-bold text-lg" id="latency">Fast</p>
      </div>
      <div class="glass rounded-2xl p-4 border border-white/10">
        <p class="text-gray-400 text-xs">Connection</p>
        <p class="font-bold text-lg text-green-400">Online</p>
      </div>
    </section>

  </main>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbylA_sosda0fHQyfTwdbEb9BoyaMzpW5c9pGLMh--fLCfdAOsn361r4wdqWee437F4l/exec";

    const robotSelect = document.getElementById("robotSelect");
    const selectedRobot = document.getElementById("selectedRobot");
    const statusBadge = document.getElementById("statusBadge");
    const actionButton = document.getElementById("actionButton");
    const latency = document.getElementById("latency");

    let currentStatus = "RUN";
    let isProcessing = true;

    async function loadRobotStatus() {
      isProcessing = true;
      actionButton.disabled = true;
      robotSelect.disabled = true;
      robotSelect.disabled = true;
      actionButton.textContent = "LOADING...";
      const robot = robotSelect.value;
      selectedRobot.textContent = robot;

      const startTime = performance.now();

      try {
        const response = await fetch(`${scriptURL}?robot=${robot}`, { cache: "no-store" });
        const status = (await response.text()).trim();
        const loadTime = Math.round(performance.now() - startTime);

        latency.textContent = loadTime + " ms";
        currentStatus = status;

        if (status === "RUN") {
          statusBadge.textContent = "RUNNING";
          statusBadge.className = "px-4 py-2 rounded-full bg-green-500/20 text-green-400 font-bold text-sm";
          actionButton.textContent = "STOP ROBOT";
          actionButton.className = "w-full bg-red-600 hover:bg-red-700 active:scale-95 transition-all rounded-2xl py-4 text-xl font-extrabold shadow-lg";
        } else {
          statusBadge.textContent = "STOPPED";
          statusBadge.className = "px-4 py-2 rounded-full bg-red-500/20 text-red-400 font-bold text-sm";
          actionButton.textContent = "START ROBOT";
          actionButton.className = "w-full bg-green-600 hover:bg-green-700 active:scale-95 transition-all rounded-2xl py-4 text-xl font-extrabold shadow-lg";
        }
              isProcessing = false;
        actionButton.disabled = false;
        robotSelect.disabled = false;
      } catch (error) {
        statusBadge.textContent = "ERROR";
        statusBadge.className = "px-4 py-2 rounded-full bg-yellow-500/20 text-yellow-400 font-bold text-sm";
        latency.textContent = "Timeout";
      }
    }

    async function toggleRobot() {
      if (isProcessing) return;
      isProcessing = true;
      const robot = robotSelect.value;
      const action = currentStatus === "RUN" ? "stop" : "start";

      actionButton.disabled = true;
      actionButton.textContent = "PROCESSING...";

      try {
        await fetch(`${scriptURL}?robot=${robot}&action=${action}`, { cache: "no-store" });
      } catch (error) {}

      actionButton.disabled = false;
      loadRobotStatus();
      setTimeout(() => {
        isProcessing = false;
        actionButton.disabled = false;
        robotSelect.disabled = false;
      }, 1200);
    }

    robotSelect.addEventListener("change", loadRobotStatus);
    actionButton.addEventListener("click", toggleRobot);

    loadRobotStatus();
      setTimeout(() => {
        isProcessing = false;
        actionButton.disabled = false;
        robotSelect.disabled = false;
      }, 1200);
  </script>

</body>
</html>
